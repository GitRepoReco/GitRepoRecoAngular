name: reporeco-web

services:
  web:
    build: .
    image: reporeco-web:latest
    container_name: reporeco-web
    init: true                      # gère correctement les signaux (arrêt propre) et les zombies
    restart: unless-stopped
    ports:
      - "32001:4200"                 # <port hôte>:<port conteneur>
    environment:
      PORT: "4200"
    volumes:
      # node_modules persistant : le npm install du redémarrage est quasi instantané
      - node_modules:/app/node_modules
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  node_modules:
